name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent CI (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system audio dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "agent/pyproject.toml"

      - name: Install agent
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: agent
        run: ruff check echocoach/

      - name: Tests
        working-directory: agent
        run: pytest -q

  web:
    name: Web CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install web
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build Next.js
        working-directory: web
        env:
          LIVEKIT_URL: "wss://ci-dummy.livekit.cloud"
          LIVEKIT_API_KEY: "dummy-key"
          LIVEKIT_API_SECRET: "dummy-secret"
        run: npm run build

