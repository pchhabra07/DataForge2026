[project]
name = "echocoach-agent"
version = "0.1.0"
description = "EchoCoach — Real-time speaking coach (LiveKit agent)"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.5,<2.0",
    "livekit-plugins-rime>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-silero>=0.7",
    "livekit-plugins-openai>=0.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
